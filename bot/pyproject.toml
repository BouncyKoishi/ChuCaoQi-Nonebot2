[project]
name = "chucaoqi-bot"
version = "2.0.0"
description = "生草系统 Bot - NoneBot2 版本"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Chucaoqi Team"}
]
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-adapter-qq>=1.4.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "tortoise-orm>=0.20.0,<1.0.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    { name = "QQ", module_name = "nonebot.adapters.qq" }
]
# 启用的插件（显式列出；禁用模块 = 注释对应行 + 重启 bot）
# 基础设施：internal_notify 为 scheduler 进程 QQ 通知入口，勿禁用
# 插件依赖（启用左侧插件须同时启用右侧插件，否则会静默复活后者）：
#   strange_word / pic_search / pic_classifier → reply_commands
#   draw_item / kusa_G → pagination_helper
#   kusa_main → kusa_statistics
plugins = [
    "plugins.internal_notify",
    # ---- 业务插件 ----
    "plugins.reply_commands",
    "plugins.strange_word",
]
builtin_plugins = ["echo"]
